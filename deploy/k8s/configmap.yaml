apiVersion: v1
kind: ConfigMap
metadata:
  name: clawhost-config
  namespace: clawhost
data:
  config.toml: |
    [server]
    port = 18080

    [api]
    admin_token = "clawhost-admin-aCBGpu7Af0vMcOpP"

    [db]
    host = "clawhost-pg"
    port = 5432
    user = "postgres"
    password = ""
    database = "clawhost"
    sslmode = "disable"
    timezone = "Asia/Shanghai"

    [kubernetes]
    kubeconfig = ""
    namespace = "clawhost"

    [storage]
    pvc_name = "clawhost-shared-data"
    base_path = "/clawhost-data"

    [domain]
    api_domain = "clawhost.ai"
    bot_domain_suffix = "clawhost.ai"
    bot_domain_template = "https://{bot_id}.clawhost.ai"

    [openclaw]
    image = "1panel/openclaw:latest"
    gateway_port = 18789
    node_max_old_space_size = 6144
    cpu_limit = "2000m"
    memory_limit = "8Gi"
    cpu_request = "500m"
    memory_request = "1Gi"